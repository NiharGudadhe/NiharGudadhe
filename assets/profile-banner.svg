<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal Background Box -->
  <rect width="800" height="300" rx="8" fill="#0d1117" stroke="#00ff66" stroke-width="2"/>
  
  <!-- Terminal Window Top Bar -->
  <path d="M 0 8 C 0 3.58172 3.58172 0 8 0 L 792 0 C 796.418 0 800 3.58172 800 8 L 800 35 L 0 35 Z" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="400" y="22" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">bash — 80x24</text>

  <!-- Terminal Text Elements -->
  <text x="30" y="70" fill="#00ff66" font-family="monospace" font-size="14">&gt; hello, world</text>
  <text x="30" y="110" fill="#ffffff" font-family="monospace" font-size="28" font-weight="bold">NIHAR GUDADHE</text>
  <text x="30" y="145" fill="#8b949e" font-family="monospace" font-size="14">Data Scientist | AI &amp; ML Engineer</text>

  <!-- Tech Badges / Pills (Python, TensorFlow, Scikit-Learn) -->
  <rect x="30" y="175" width="80" height="26" rx="4" fill="#21262d" stroke="#30363d"/>
  <text x="70" y="192" fill="#00ff66" font-family="monospace" font-size="12" text-anchor="middle">Python</text>

  <rect x="120" y="175" width="100" height="26" rx="4" fill="#21262d" stroke="#30363d"/>
  <text x="170" y="192" fill="#00ff66" font-family="monospace" font-size="12" text-anchor="middle">TensorFlow</text>

  <rect x="230" y="175" width="105" height="26" rx="4" fill="#21262d" stroke="#30363d"/>
  <text x="282.5" y="192" fill="#00ff66" font-family="monospace" font-size="12" text-anchor="middle">Scikit-Learn</text>

  <!-- Right Side Terminal Frame/Image Placeholder -->
  <rect x="530" y="55" width="240" height="210" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="650" y="160" fill="#30363d" font-family="monospace" font-size="12" text-anchor="middle">// Terminal Matrix</text>
</svg>
